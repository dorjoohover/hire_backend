version: "3.9"

services:
  # -------------------------
  # PostgreSQL 17
  # -------------------------
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: hire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  # -------------------------
  # CORE API (NestJS)
  # -------------------------
  core:
    build:
      context: ./hire_backend_core
      dockerfile: Dockerfile
    container_name: core
    restart: always
    env_file:
      - ./hire_backend_core/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5000:5000"

  # -------------------------
  # REPORT SERVICE (NestJS)
  # -------------------------
  report:
    build:
      context: ./report
      dockerfile: Dockerfile
    container_name: report
    restart: always
    env_file:
      - ./report/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"

volumes:
  pg-data:
  redis-data:
